services:
  notification-service:
    build: .
    environment:
      PORT: 3005
      NODE_ENV: production
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-compose-secret-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-ecommerce-user-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ecommerce-api}
      NOTIFICATION_STORE_DRIVER: postgres
      DATABASE_URL: postgresql://notification:notification@postgres:5432/notifications
      DATABASE_SSL: "false"
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-local-internal-secret}
    ports: ["3005:3005"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
    ports: ["5434:5432"]
    volumes: [notification-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  notification-data:
