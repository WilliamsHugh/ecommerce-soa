services:
  product-service:
    build: .
    env_file:
      - path: ./.env
        required: false
    environment:
      PORT: 3002
      NODE_ENV: ${NODE_ENV:-development}
      PRODUCT_STORE_DRIVER: mongodb
      MONGODB_URI: mongodb://mongodb:27017/product_service?replicaSet=rs0
      MONGODB_DATABASE: product_service
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localhost:9000}
      S3_HEALTH_URL: http://minio:9000/minio/health/live
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-product-images}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-development-secret-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-ecommerce-user-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ecommerce-api}
    ports: ["3002:3002"]
    depends_on:
      mongodb: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/ready').then(r => { if (!r.ok) process.exit(1) })",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  mongodb:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: [product-mongo-data:/data/db]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongodb:27017\"}]}).ok }' | grep 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports: ["9000:9000", "9001:9001"]
    volumes: [product-minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin123}
      && mc mb --ignore-existing local/$${S3_BUCKET:-product-images}
      && mc anonymous set download local/$${S3_BUCKET:-product-images}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_BUCKET: ${S3_BUCKET:-product-images}

volumes:
  product-mongo-data:
  product-minio-data:
